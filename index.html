<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GLTF Scene Modeler</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1e1e1e;
      font-family: sans-serif;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      background: #2a2a2a;
      z-index: 10;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tool-group {
      display: flex;
      gap: 4px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .tool.active {
      background: #4a90e2;
    }

    #menu {
      position: absolute;
      top: 44px;
      left: 0;
      width: 220px;
      bottom: 0;
      background: #2b2b2b;
      padding: 10px;
      overflow-y: auto;
      transition: transform 0.2s;
      z-index: 9;
    }

    #menu.collapsed {
      transform: translateX(-100%);
    }

    #cursorBrush {
      position: absolute;
      pointer-events: none;
      border: 1px solid #4a90e2;
      border-radius: 50%;
      z-index: 5;
    }

    /* Bottom Panel Styles */
    #bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      background: rgba(43, 43, 43, 0.95);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateY(180px); /* Hide content, show handle */
      transition: transform 0.3s ease;
      pointer-events: none;
      border-top: 1px solid #555;
    }

    #bottom-panel.expanded {
      transform: translateY(0);
      pointer-events: auto;
    }

    #panel-handle {
      height: 40px;
      background: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      user-select: none;
      pointer-events: auto; 
      border-bottom: 1px solid #333;
      font-size: 12px;
    }

    #panel-content {
      flex: 1;
      display: flex;
      padding: 0;
      min-height: 0;
    }

    /* Left and Right Wrappers */
    #trackpad-area, #action-area-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 10px;
      min-width: 0;
    }

    /* Panel Headers (Mode buttons / Undo Redo) */
    .panel-header {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      height: 34px;
      flex-shrink: 0;
    }

    .panel-header button {
      flex: 1;
      background: #444;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      padding: 0;
    }

    .panel-header button.active {
      background: #4a90e2;
      border-color: #4a90e2;
    }

    /* Surface Areas */
    .area-surface, #action-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 14px;
      user-select: none;
      touch-action: none;
      border: 1px dashed #555;
      border-radius: 8px;
      overflow: hidden;
    }

    .area-surface {
      background: rgba(255, 255, 255, 0.02);
    }

    #action-area {
      background: rgba(74, 144, 226, 0.1);
      border-color: #4a90e2;
      color: #4a90e2;
    }
  </style>
</head>

<body>
  <!-- Top Bar -->
  <div id="topbar">
    <button id="toggleMenu">☰</button>

    <div class="tool-group">
      <button id="toolSculpt" class="tool active">Sculpt</button>
      <button id="toolPaint" class="tool">Paint</button>
      <button id="toolMove" class="tool">Move</button>
      <button id="toolRotate" class="tool">Rotate</button>
      <button id="toolScale" class="tool">Scale</button>
    </div>

    <button id="toggleWire">▦</button>
    <button id="toggleSymmetry">⇋ Symmetry</button>
  </div>

  <!-- Side Menu -->
  <div id="menu" class="collapsed">
    <h3>Model</h3>
    <button id="newCube">New Cube</button>
    <button id="newSphere">New Sphere</button>

    <h3>Sculpt / Paint</h3>
    
    <div id="paintOptions" style="display: none; margin-bottom: 10px;">
      <label>Paint Color</label>
      <input type="color" id="paintColor" value="#ff0000" style="width: 100%; height: 30px; border: none; padding: 0; cursor: pointer;" />
    </div>

    <label>Brush Size</label>
    <input type="range" id="brushSize" min="0.2" max="3" step="0.1" value="1" />

    <label>Strength</label>
    <input type="range" id="brushStrength" min="0.01" max="1" step="0.01" value="0.3" />

    <h3>Tools</h3>
    <button id="toolInflate">Inflate</button>
    <button id="toolDeflate">Deflate</button>
    <button id="toolSmooth">Smooth</button>
    <button id="toolFlatten">Flatten</button>
    <button id="toolPinch">Pinch</button>

    <h3>File</h3>
    <button id="exportGLTF">Export GLTF</button>
    <input type="file" id="importGLTF" accept=".gltf,.glb" />
  </div>

  <!-- Bottom Panel -->
  <div id="bottom-panel">
    <div id="panel-handle">▲</div>
    <div id="panel-content">
      
      <!-- Left Trackpad -->
      <div id="trackpad-area">
        <div class="panel-header">
          <button id="btnModeCamera" class="active">Camera</button>
          <button id="btnModeBrush">Brush</button>
        </div>
        <div id="trackpad-surface" class="area-surface">
          <span>Move Camera (Trackpad)</span>
        </div>
      </div>

      <!-- Right Action Area -->
      <div id="action-area-wrapper">
        <div class="panel-header">
          <button id="panelUndoBtn">⟲ Undo</button>
          <button id="panelRedoBtn">⟳ Redo</button>
        </div>
        <div id="action-area">
          <span>Sculpt / Paint</span>
        </div>
      </div>

    </div>
  </div>

  <div id="cursorBrush"></div>
  <canvas id="viewport"></canvas>

  <script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
