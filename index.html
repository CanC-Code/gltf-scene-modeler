<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GLTF Scene Modeler</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }

    #topbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; background: #2a2a2a; z-index: 10; gap: 8px; padding: 0 8px; box-sizing: border-box; overflow-x: auto; white-space: nowrap; }
    .tool-group { display: flex; gap: 4px; flex-shrink: 0; }
    .tool { padding: 6px 10px; background: #444; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .tool.active { background: #4a90e2; border-color: #4a90e2; }

    #menu { position: absolute; top: 44px; left: 0; width: 260px; bottom: 0; background: #2b2b2b; padding: 15px; padding-bottom: 250px; overflow-y: auto; transition: transform 0.2s; z-index: 9; color: #ddd; box-sizing: border-box; }
    #menu.collapsed { transform: translateX(-100%); }
    #menu h3 { margin: 15px 0 8px 0; font-size: 14px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;}
    #menu label { display: block; margin-top: 10px; margin-bottom: 4px; font-size: 12px; color: #aaa; }
    #menu input[type="range"] { width: 100%; margin-bottom: 10px; }
    #menu button { margin-bottom: 6px; width: 100%; padding: 10px; background: #3a3a3a; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #menu button:hover { background: #4a90e2; border-color: #4a90e2; }
    #menu button.active { background: #4a90e2; border-color: #4a90e2; color: white; }
    #menu input[type="color"] { width: 100%; height: 32px; border: none; padding: 0; cursor: pointer; background: transparent; }

    .panel-section { display: none; }
    .panel-section.active { display: block; }

    #object-list, #bone-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #444; border-radius: 4px; padding: 4px; background: #222; }
    .list-item { padding: 8px; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .list-item:hover { background: #333; }
    .list-item.active { background: #4a90e2; color: white; }

    #bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 260px; background: rgba(43, 43, 43, 0.95); z-index: 20; display: flex; flex-direction: column; transform: translateY(220px); transition: transform 0.3s ease; pointer-events: none; border-top: 1px solid #555; }
    #bottom-panel.expanded { transform: translateY(0); pointer-events: auto; }
    
    #panel-handle { height: 44px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff; user-select: none; pointer-events: auto; border-bottom: 1px solid #333; padding: 0 15px; position: relative; }
    .handle-arrow { font-size: 12px; position: absolute; left: 50%; transform: translateX(-50%); }
    .handle-left-group { display: flex; align-items: center; gap: 8px; z-index: 25; }

    #tool-selector-container { position: relative; flex-shrink: 0; }
    #tool-selector-btn { padding: 6px 12px; background: #4a90e2; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    #tool-dropdown { display: none; position: absolute; bottom: 100%; left: 0; width: 120px; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; margin-bottom: 5px; z-index: 100; flex-direction: column; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
    #tool-dropdown.show { display: flex; }
    #tool-dropdown button { padding: 12px; background: transparent; color: #ddd; border: none; border-bottom: 1px solid #444; text-align: left; cursor: pointer; font-size: 14px; }
    #tool-dropdown button:hover, #tool-dropdown button.active { background: #4a90e2; color: white; }

    #color-picker-btn { width: 32px; height: 32px; border-radius: 4px; border: 2px solid #fff; cursor: pointer; background: #ff0000; }

    #panel-content { flex: 1; display: flex; padding: 0; min-height: 0; }
    #trackpad-area, #action-area-wrapper { flex: 1; display: flex; flex-direction: column; margin: 10px; min-width: 0; }

    .panel-header { display: flex; gap: 6px; margin-bottom: 8px; height: 34px; flex-shrink: 0; }
    .panel-header button { flex: 1; background: #444; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 500; padding: 0; }
    .panel-header button.active { background: #4a90e2; border-color: #4a90e2; }
    .area-surface, #action-area { flex: 1; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; user-select: none; touch-action: none; border: 1px dashed #555; border-radius: 8px; overflow: hidden; }
    .area-surface { background: rgba(255, 255, 255, 0.02); }
    #action-area { background: rgba(74, 144, 226, 0.1); border-color: #4a90e2; color: #4a90e2; transition: pointer-events 0.2s; }

    /* Floating Custom Color Picker Modal */
    #color-picker-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); opacity: 0; pointer-events: none; background: #2a2a2a; z-index: 1000; transition: all 0.2s ease; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; border: 1px solid #555; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 340px; }
    #color-picker-modal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    #color-picker-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: white; font-size: 16px; font-weight: bold; }
    #color-picker-close { cursor: pointer; padding: 5px; color: #aaa; }
    .color-picker-content { display: flex; flex-direction: column; gap: 15px; }
    #color-wheel-container { display: flex; justify-content: center; }
    #color-wheel { width: 200px; height: 200px; border-radius: 50%; cursor: crosshair; touch-action: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    .sliders { display: flex; flex-direction: column; gap: 10px; }
    .slider-group { display: flex; align-items: center; gap: 10px; }
    .slider-group label { width: 20px; color: #aaa; font-size: 12px; font-weight: bold; }
    .slider-group input[type="range"] { flex: 1; }
    #color-preview { width: 100%; height: 40px; border-radius: 6px; border: 1px solid #555; }
    #cp-apply { padding: 10px; background: #4a90e2; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
  </style>
</head>

<body>
  <div id="topbar">
    <button id="toggleMenu" class="tool">☰</button>
    <div class="tool-group">
      <button id="toolSculpt" class="tool active">Sculpt</button>
      <button id="toolPaint" class="tool">Paint</button>
      <button id="toolRig" class="tool">Rig</button>
      <button id="toolMove" class="tool">Move</button>
      <button id="toolRotate" class="tool">Rotate</button>
      <button id="toolScale" class="tool">Scale</button>
    </div>
  </div>

  <div id="menu" class="collapsed">
    <div id="scene-panel" class="panel-section active">
      <h3>Scene Objects</h3>
      <div id="object-list"></div>
      <button id="duplicateObject">Duplicate Active</button>
      <button id="deleteObject" style="background: #d32f2f;">Delete Active</button>

      <h3>Add Object</h3>
      <button id="newCube">Add Cube</button>
      <button id="newSphere">Add Sphere</button>

      <h3>Scene Settings</h3>
      <label>Background Color</label>
      <input type="color" id="bgColor" value="#b0c4de" />
      <button id="toggleWire">▦ Toggle Wireframe</button>

      <h3>File</h3>
      <button id="exportGLTF">Export GLTF</button>
      <input type="file" id="importGLTF" accept=".gltf,.glb" style="color: #fff; margin-top: 5px;" />
    </div>

    <div id="rig-panel" class="panel-section">
      <h3>Armature</h3>
      <button id="addBoneChain" style="background: #4caf50;">Create Armature</button>
      <button id="bindSkin" style="background: #ff9800;">Bind Skin to Bones</button>
      
      <h3>Select Bone</h3>
      <div id="bone-list">
        <p style="font-size: 12px; color: #888; text-align: center;">No bones found</p>
      </div>

      <h3>Bone Settings</h3>
      <button id="showSkeleton" class="active">Toggle Skeleton View</button>
    </div>

    <div id="sculpt-panel" class="panel-section">
      <h3>Trackpad</h3>
      <label>Cursor Speed</label>
      <input type="range" id="trackpadSensitivity" min="0.2" max="1.5" step="0.1" value="0.6" />

      <h3>Brush Settings</h3>
      <label>Brush Size</label>
      <input type="range" id="brushSize" min="0.05" max="1.5" step="0.05" value="0.2" />
      <label>Strength</label>
      <input type="range" id="brushStrength" min="0.01" max="1" step="0.01" value="0.5" />
      <button id="toggleSymmetry">⇋ Toggle Symmetry</button>
    </div>
  </div>

  <div id="bottom-panel">
    <div id="panel-handle">
      <div class="handle-left-group">
        <div id="tool-selector-container">
          <button id="tool-selector-btn">Tool: Inflate ▼</button>
          <div id="tool-dropdown">
            <button class="tool-opt active" data-tool="inflate">Inflate</button>
            <button class="tool-opt" data-tool="deflate">Deflate</button>
            <button class="tool-opt" data-tool="smooth">Smooth</button>
            <button class="tool-opt" data-tool="flatten">Flatten</button>
            <button class="tool-opt" data-tool="pinch">Pinch</button>
          </div>
        </div>
        <button id="color-picker-btn" title="Paint Color"></button>
      </div>
      <span class="handle-arrow">▲</span>
      <div style="width: 120px;"></div>
    </div>

    <div id="panel-content">
      <div id="trackpad-area">
        <div class="panel-header">
          <button id="btnModeCamera" class="active">Camera</button>
          <button id="btnModeBrush">Brush</button>
        </div>
        <div id="trackpad-surface" class="area-surface">
          <span>Move Camera (Trackpad)</span>
        </div>
      </div>

      <div id="action-area-wrapper">
        <div class="panel-header">
          <button id="panelUndoBtn">⟲ Undo</button>
          <button id="panelRedoBtn">⟳ Redo</button>
        </div>
        <div id="action-area">
          <span>Sculpt / Paint</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Color Picker -->
  <div id="color-picker-modal">
    <div id="color-picker-header">
      <span>Color Picker</span>
      <span id="color-picker-close">✕</span>
    </div>
    <div class="color-picker-content">
      <div id="color-wheel-container">
        <canvas id="color-wheel" width="200" height="200"></canvas>
      </div>
      <div class="sliders">
        <div class="slider-group"><label>R</label><input type="range" id="cp-r" min="0" max="255" value="255"></div>
        <div class="slider-group"><label>G</label><input type="range" id="cp-g" min="0" max="255" value="0"></div>
        <div class="slider-group"><label>B</label><input type="range" id="cp-b" min="0" max="255" value="0"></div>
        <div id="color-preview" style="background: #ff0000;"></div>
        <button id="cp-apply">Apply Color</button>
      </div>
    </div>
  </div>

  <div id="cursorBrush"></div>
  <canvas id="viewport"></canvas>
  <script type="module" src="./js/main.js?v=18"></script>
</body>
</html>
