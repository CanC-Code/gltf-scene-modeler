<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GLTF Scene Modeler</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <!-- Top Bar -->
  <div id="topbar">
    <button id="toggleMenu">☰</button>

    <div class="tool-group">
      <button id="toolSculpt" class="tool active">Sculpt</button>
      <button id="toolPaint" class="tool">Paint</button>
      <button id="toolMove" class="tool">Move</button>
      <button id="toolRotate" class="tool">Rotate</button>
      <button id="toolScale" class="tool">Scale</button>
    </div>

    <button id="toggleWire">▦</button>
    <button id="undoBtn">⟲ Undo</button>
    <button id="redoBtn">⟳ Redo</button>
    <button id="toggleSymmetry">⇋ Symmetry</button>
  </div>

  <!-- Side Menu -->
  <div id="menu" class="collapsed">
    <h3>Model</h3>
    <button id="newCube">New Cube</button>
    <button id="newSphere">New Sphere</button>

    <h3>Sculpt / Paint</h3>
    
    <div id="paintOptions" style="display: none; margin-bottom: 10px;">
      <label>Paint Color</label>
      <input type="color" id="paintColor" value="#ff0000" style="width: 100%; height: 30px; border: none; padding: 0; cursor: pointer;" />
    </div>

    <label>Brush Size</label>
    <input type="range" id="brushSize" min="0.2" max="3" step="0.1" value="1" />

    <label>Strength</label>
    <input type="range" id="brushStrength" min="0.01" max="1" step="0.01" value="0.3" />

    <h3>Tools</h3>
    <button id="toolInflate">Inflate</button>
    <button id="toolDeflate">Deflate</button>
    <button id="toolSmooth">Smooth</button>
    <button id="toolFlatten">Flatten</button>
    <button id="toolPinch">Pinch</button>

    <h3>File</h3>
    <button id="exportGLTF">Export GLTF</button>
    <input type="file" id="importGLTF" accept=".gltf,.glb" />
  </div>

  <!-- Bottom Panel -->
  <div id="bottom-panel">
    <div id="panel-handle">▲</div>
    <div id="panel-content">
      <div id="trackpad-area">
        <span>Move Camera (Trackpad)</span>
      </div>
      <div id="action-area">
        <span>Sculpt / Paint</span>
      </div>
    </div>
  </div>

  <div id="cursorBrush"></div>
  <canvas id="viewport"></canvas>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
